[test]
# Isolates SUPERSET_HOME_DIR so a test can never write the developer's real
# ~/.superset. See scripts/test-preload.ts for what went wrong without it.
preload = ["./scripts/test-preload.ts"]

[install]
linker = "isolated" # Prevent hoisting from resolving `path-scurry@2` to `lru-cache@6` (missing `LRUCache`), which breaks the `@superset/desktop` postinstall native rebuild.
exact = true
minimumReleaseAge = 259200
# Expo SDK 58 (expo 58.0.21, react-native 0.88.1, react-native-screens 4.30.1)
# landed inside the 3-day window on 2026-10-28. CI installs frozen from the
# lockfile and is unaffected, but a fresh `bun install` re-resolves and fails on
# every one of these. Excluding them keeps the repo installable from scratch.
# Remove once the pins age past the window — they are exact, so this list only
# ever covers versions we already chose.
# @xterm/*: upstream publishes betas only, the pins are exact, and our patches are
# rebuilt from the package's source commit (patches/README.md), so the version is
# read before it ships.
# @vercel/sandbox: the sandbox SDK ships fixes we depend on within days, and the
# pin is exact, so the guard would only ever delay a version we already chose.
# The ACP adapters track the protocol draft and cut releases daily, so the
# version the registry serves is always inside the window, and so are the agent
# SDKs they depend on. The adapter pins are exact.
# @expo/hub-client and expo-device-hub: Expo releases them together and the
# Mobile pane tracks each release as it ships. Exact pins.
# electron: 44.9.3 carries the October 2026 security fixes and electron#54908
# (sessions failing every request after a Network Service restart). Exact pin;
# remove after 2026-10-24.
# @pierre/highlights: @pierre/diffs 1.6.2 pins 0.3.0 (2026-10-26). Exact pin;
# remove after 2026-10-30.
minimumReleaseAgeExcludes = [
  "@agentclientprotocol/claude-agent-acp",
  "@agentclientprotocol/codex-acp",
  "@agentclientprotocol/sdk",
  "@anthropic-ai/claude-agent-sdk",
