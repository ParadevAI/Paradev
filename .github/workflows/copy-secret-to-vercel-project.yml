name: Copy BETTER_AUTH_SECRET to the admin Vercel project

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Write the variable. Leave unchecked for a dry run that only reports.
        type: boolean
        default: false
      overwrite:
        description: Replace BETTER_AUTH_SECRET if the project already has it. Apply refuses without this.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  copy:
    name: Copy BETTER_AUTH_SECRET
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    concurrency:
      group: copy-secret-to-vercel-project
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Copy BETTER_AUTH_SECRET
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          PROJECT: paradev-admin
          APPLY: ${{ inputs.apply }}
          OVERWRITE: ${{ inputs.overwrite }}
        run: |
          set -euo pipefail
          bash scripts/copy-secret-to-vercel-project.sh
