name: Experimental Windows Desktop Build

on:
  push:
    branches:
      - feat/windows-build-experimental
  workflow_dispatch:
    inputs:
      artifact_name:
        description: "Name for the uploaded Windows installer artifact"
        required: false
        default: "paradev-windows-x64-experimental"
        type: string

permissions:
  contents: read

concurrency:
  group: windows-experimental-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build Windows x64 installer (experimental)
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Set up Python for native modules
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Visual Studio C++ Build Tools
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies
        shell: pwsh
        run: bun install --frozen --ignore-scripts

      - name: Install desktop native dependencies
        working-directory: apps/desktop
        shell: pwsh
        run: bun run install:deps

      - name: Clean development output
        working-directory: apps/desktop
        shell: pwsh
        run: bun run clean:dev

      - name: Generate file icons
        working-directory: apps/desktop
        shell: pwsh
        run: bun run generate:icons

      - name: Compile desktop application
        working-directory: apps/desktop
        env:
          SUPERSET_WORKSPACE_NAME: superset
          TARGET_ARCH: x64
          PDEV_BUNDLE_REQUIRED: "1"
        shell: pwsh
        run: bun run compile:app

      - name: Copy packaged native modules
        working-directory: apps/desktop
        shell: pwsh
        run: bun run copy:native-modules

      - name: Validate native runtime dependencies
        working-directory: apps/desktop
        shell: pwsh
        run: bun run validate:native-runtime

      - name: Package Windows installer
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          DESKTOP_DISPLAY_NAME: Paradev
        shell: pwsh
        run: bun run package -- --publish never --config electron-builder.ts --win nsis --x64

      - name: Verify installer exists
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path "apps/desktop/release" -Filter "*.exe" -File
          if (-not $files) {
            Write-Error "No Windows EXE installer was generated in apps/desktop/release"
            Get-ChildItem -Path "apps/desktop/release" -Force | Format-Table Name,Length
            exit 1
          }
          $files | Format-Table Name,Length
          "Installer count: $($files.Count)"

      - name: Upload Windows installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.artifact_name || 'paradev-windows-x64-experimental' }}
          path: apps/desktop/release/*.exe
          if-no-files-found: error
          retention-days: 14
