name: Cleanup Preview

on:
  pull_request:
    types: [closed]

jobs:
  cleanup:
    name: Cleanup Preview Resources
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: preview
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Setup Bun for owned-domain cleanup
        if: contains(github.event.pull_request.labels.*.name, 'domain-preview')
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3

      - name: Remove owned preview aliases
        if: contains(github.event.pull_request.labels.*.name, 'domain-preview')
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          failed=0
          for host in "pr-$PR_NUMBER.paradev.com" "app.pr-$PR_NUMBER.paradev.com" "api.pr-$PR_NUMBER.paradev.com"; do
            bunx vercel@50.22.1 alias rm "$host" --yes --scope="$VERCEL_ORG_ID" --token="$VERCEL_TOKEN" || failed=1
          done
          exit "$failed"

      - name: Delete Neon branch
        id: neon-cleanup
        uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3.2.1
        continue-on-error: true
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch: ${{ github.event.pull_request.head.ref }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Update comment
        if: always()
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3.0.1
        with:
          message: |
            ## 🧹 Preview Cleanup Complete

            The following preview resources have been cleaned up:
            - ${{ steps.neon-cleanup.outcome == 'success' && '✅' || '⚠️' }} Neon database branch

            Thank you for your contribution! 🎉
          comment-tag: "🚀-preview-deployment"
