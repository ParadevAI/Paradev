name: Seed shared environments

# The shared environments live in a sentinel organization every organization can
# read, so seeding them is one-time data setup rather than a per-deploy step.
# Re-running is safe: the script upserts one organization and one environment.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Which database to seed"
        type: choice
        options:
          - production
          - preview
        default: preview

concurrency:
  group: seed-shared-environments-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  seed:
    name: Seed (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen --ignore-scripts

      - name: Seed
        env:
          SKIP_ENV_VALIDATION: "1"
          DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          BLAXEL_SANDBOX_IMAGE: ${{ secrets.BLAXEL_SANDBOX_IMAGE }}
        run: bun run db:seed-shared-environments
