name: Sandbox

on:
  pull_request:
    paths:
      - "packages/sandbox/**"
      - "packages/host-service/**"
      - "packages/pty-daemon/**"
      - "packages/shared/src/sandbox/contract.ts"
      - ".github/workflows/sandbox.yml"
  push:
    branches: [main]
    paths:
      - "packages/sandbox/**"
      - "packages/shared/src/sandbox/contract.ts"
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      run:
        description: "real-sandbox: boot one sandbox and run the wake, gate and firewall checks. production-release (main only): push the image, rebuild the internal golden and repoint production's environment rows"
        type: choice
        options:
          - real-sandbox
          - production-release
          - inventory
        default: real-sandbox

jobs:
  boot-twice:
    name: Boot twice
    if: github.event_name == 'pull_request'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        id: setup-bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Cache dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ steps.setup-bun.outputs.bun-revision }}-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen --ignore-scripts

      - name: Manifest tests
        working-directory: packages/sandbox
        run: bun test

      - name: Build the bundle
        working-directory: packages/sandbox
        run: bun run build

      - name: Step versions that would re-run on the next wake
        working-directory: packages/sandbox
        env:
          CDN_R2_ACCESS_KEY_ID: ${{ secrets.CDN_R2_ACCESS_KEY_ID }}
          CDN_R2_SECRET_ACCESS_KEY: ${{ secrets.CDN_R2_SECRET_ACCESS_KEY }}
          CDN_R2_ENDPOINT: ${{ secrets.CDN_R2_ENDPOINT }}
          CDN_R2_BUCKET: ${{ secrets.CDN_R2_BUCKET }}
          CDN_URL: ${{ secrets.CDN_URL }}
        run: bun run build --dry

      # Keeps the builder's layers on a persistent disk between runs.
      - name: Set up the Docker builder
        uses: useblacksmith/setup-docker-builder@19215110ab936351210feebdfa5b440b4493e184 # v2.2.0
        with:
          cache-key: sandbox-image

      - name: Build the image locally
        working-directory: packages/sandbox
        run: bun run image --local

      - name: Boot it twice
        working-directory: packages/sandbox
        run: bun run src/boot-twice.ts

      - name: Check the runner against a synthetic bundle
        working-directory: packages/sandbox
        run: bun run src/runner-check.ts

  publish-bundle:
    name: Publish the bundle
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        id: setup-bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen --ignore-scripts

      - name: Publish
        working-directory: packages/sandbox
        env:
          CDN_R2_ACCESS_KEY_ID: ${{ secrets.CDN_R2_ACCESS_KEY_ID }}
          CDN_R2_SECRET_ACCESS_KEY: ${{ secrets.CDN_R2_SECRET_ACCESS_KEY }}
          CDN_R2_ENDPOINT: ${{ secrets.CDN_R2_ENDPOINT }}
          CDN_R2_BUCKET: ${{ secrets.CDN_R2_BUCKET }}
          CDN_URL: ${{ secrets.CDN_URL }}
        run: bun run build --publish

  real-sandbox:
    name: Real sandbox
    if: github.event_name == 'workflow_dispatch' && inputs.run == 'real-sandbox'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        id: setup-bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen --ignore-scripts

      - name: Boot a dev sandbox and check it
        working-directory: packages/sandbox
        env:
          VERCEL_SANDBOX_TOKEN: ${{ secrets.VERCEL_SANDBOX_TOKEN }}
          VERCEL_SANDBOX_TEAM_ID: ${{ secrets.VERCEL_SANDBOX_TEAM_ID }}
          VERCEL_SANDBOX_PROJECT_ID: ${{ secrets.VERCEL_SANDBOX_PROJECT_ID }}
          SANDBOX_GATE_SECRET: ${{ secrets.SANDBOX_GATE_SECRET }}
          SANDBOX_GATE_ORIGIN: ${{ secrets.SANDBOX_GATE_ORIGIN }}
          CDN_R2_ACCESS_KEY_ID: ${{ secrets.CDN_R2_ACCESS_KEY_ID }}
          CDN_R2_SECRET_ACCESS_KEY: ${{ secrets.CDN_R2_SECRET_ACCESS_KEY }}
          CDN_R2_ENDPOINT: ${{ secrets.CDN_R2_ENDPOINT }}
          CDN_R2_BUCKET: ${{ secrets.CDN_R2_BUCKET }}
          CDN_URL: ${{ secrets.CDN_URL }}
        run: bun run src/real-sandbox.ts

  inventory:
    name: Snapshot inventory
    if: github.event_name == 'workflow_dispatch' && inputs.run == 'inventory'
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen --ignore-scripts

      - name: Summarize snapshot sizes
        working-directory: packages/sandbox
        env:
          VERCEL_SANDBOX_TOKEN: ${{ secrets.VERCEL_SANDBOX_TOKEN }}
          VERCEL_SANDBOX_TEAM_ID: ${{ secrets.VERCEL_SANDBOX_TEAM_ID }}
          VERCEL_SANDBOX_PROJECT_ID: ${{ secrets.VERCEL_SANDBOX_PROJECT_ID }}
        run: |
          set -euo pipefail
          bun run src/wake-fix.ts || echo "::warning::wake-fix exited $?"
          bun run inventory --json > "$RUNNER_TEMP/inv.json"
          cat > "$RUNNER_TEMP/pub.pem" <<'KEY'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEA1LK17MI10z6koq3pFu7n
          pmvhxb8uWFyjcL4e/gj28bUjrRdmrhmF2LMlnPsy5TTwiTmLeoXSsRG4l9qWsS74
          YWnzRuarM3bJLfsBeu5tLfGfqMF0L8Ab0Cxf7C/bXUOs7eIkvfOXcP7nN/Z5+K+O
          g1lrvX0WZLwhGBMAn0EtseEtMiVSLfjIqE28n+bv4WHU5uClA4c5fIsBz6ReBJls
          jzHNX6yM3yslOdAC+I4kjqOilHvrPjVmg+SjRdorF2YQLUG7gy1b4bdzM+ExAcCJ
          tA4i85JbEQPBESdxC342JyCevDwfNVzxRAsQPXR5lyZnqn/HIrOck6nZDDJuliJi
          9h4VjlEMc0dmAJlNtZTY+RoLy99udcnTHl4Rpk8Mu2K07MsI63b0Cls1GkSLCyLX
          86FntgMNwKET4L0bs5DizQVWgj/VPgC/+yrGHrqijp+vxTyluKfxihP4hfqpNXxO
          FgK/UJJbjbqmN2ZquxXCqUuDwDvErIxCc/iWk8TokTX5AgMBAAE=
          -----END PUBLIC KEY-----
          KEY
          mkdir -p "$RUNNER_TEMP/out"
          openssl rand -out "$RUNNER_TEMP/k" 32
          openssl pkeyutl -encrypt -pubin -inkey "$RUNNER_TEMP/pub.pem" -pkeyopt rsa_padding_mode:oaep -in "$RUNNER_TEMP/k" -out "$RUNNER_TEMP/out/k.enc"
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass file:"$RUNNER_TEMP/k" -in "$RUNNER_TEMP/inv.json" -out "$RUNNER_TEMP/out/inv.json.enc"
          rm -f "$RUNNER_TEMP/k" "$RUNNER_TEMP/inv.json"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: inv
          path: ${{ runner.temp }}/out
          retention-days: 1

  production-release:
    name: Production release
    # A merge that touches the image or the bundle releases it, and the nightly
    # run carries everything else: host-service and the CLI from main, the
    # latest claude, codex and Chrome, and the image's apt packages.
    if: |
      github.ref == 'refs/heads/main' && (
        github.event_name == 'push' ||
        github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' && inputs.run == 'production-release')
      )
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 120
    concurrency:
      group: sandbox-production-release
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Bun
        id: setup-bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen --ignore-scripts

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Release
        working-directory: packages/sandbox
        env:
          SUPERSET_INTERNAL_ORGANIZATION_ID: a1b2c3d4-e5f6-7890-abcd-ef1234567890
          SUPERSET_INTERNAL_ENVIRONMENT_ID: 1dcfb8ac-da71-4860-b2a2-9cf24878f703
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          VERCEL_SANDBOX_TOKEN: ${{ secrets.VERCEL_SANDBOX_TOKEN }}
          VERCEL_SANDBOX_TEAM_ID: ${{ secrets.VERCEL_SANDBOX_TEAM_ID }}
          VERCEL_SANDBOX_PROJECT_ID: ${{ secrets.VERCEL_SANDBOX_PROJECT_ID }}
          SANDBOX_GATE_SECRET: ${{ secrets.SANDBOX_GATE_SECRET }}
          SANDBOX_GATE_ORIGIN: ${{ secrets.SANDBOX_GATE_ORIGIN }}
          CDN_R2_ACCESS_KEY_ID: ${{ secrets.CDN_R2_ACCESS_KEY_ID }}
          CDN_R2_SECRET_ACCESS_KEY: ${{ secrets.CDN_R2_SECRET_ACCESS_KEY }}
          CDN_R2_ENDPOINT: ${{ secrets.CDN_R2_ENDPOINT }}
          CDN_R2_BUCKET: ${{ secrets.CDN_R2_BUCKET }}
          CDN_URL: ${{ secrets.CDN_URL }}
        run: bun run release --production

      - name: Report a failed release
        if: failure() && github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Nightly sandbox release failed"
          issue=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "Failed again: $RUN_URL"
          else
            gh issue create --title "$title" --body "Boxes keep the previous release until a release passes. Event: ${{ github.event_name }}. Run: $RUN_URL"
          fi
