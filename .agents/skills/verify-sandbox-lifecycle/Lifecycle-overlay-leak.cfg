\* OVERLAY with the pin check: a golden pinned at the last build is never pruned once its workspace goes.
\* Scenario: golden.
SPECIFICATION FairSpec
CONSTANTS
  WS = {w1, w2}
  Ops = {"build", "envarchive", "org"}
  Expire = 3  Grace = 2  FailKeep = 3  ProvStuck = 1
  LeftoverAge = 2  KeepGoldens = 1  MaxGoldens = 2  MaxReleases = 2
  DeleteFromPreview = FALSE  Overlay = TRUE  PinCheck = TRUE  CleanupPrunesPinned = FALSE
  RetireFirst = TRUE  TeardownRetries = TRUE  FailTearsDown = FALSE  VercelExpiry = FALSE
  Rule1On = TRUE  Rule2On = TRUE  Rule3On = TRUE  GraceOn = TRUE
  LeftoverBoxesOnly = FALSE
INVARIANTS TypeOK
PROPERTIES NoLeak
CHECK_DEADLOCK FALSE
